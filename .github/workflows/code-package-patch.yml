name: code-package-patch

on:
  pull_request:
    branches: [develop, 'release_*']
  push:
    branches: [develop, 'release_*']

permissions:
  contents: read

jobs:
  powershell:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet build src/Powershell.Http/Microsoft.ServiceFabric.Powershell.Http.csproj -graph -c Release
      - name: Validate patch commands without a cluster
        shell: pwsh
        run: ./test/Powershell.Http/CodePackagePatchTests.ps1 -ModulePath ./bin/Release/netstandard2.0/Microsoft.ServiceFabric.Powershell.Http.dll